[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch-ai-harness-bridge"
version = "0.1.0"
description = "Local AI agent bridge for Scratch 1.4"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scratch-ai-bridge = "harness.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: opt-in tests that call the real model endpoint (skipped without DEEPSEEK_API_KEY)",
]
