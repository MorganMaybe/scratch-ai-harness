name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bridge
        run: python -m pip install -e "bridge[dev]"
      - name: Run tests
        working-directory: bridge
        run: python -m pytest -q
      - name: Static-check Squeak sources
        run: python tools/check_st.py

  documents:
    name: Release docs present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required release files
        run: |
          test -f README.md
          test -f QUICKSTART.md
          test -f TESTING.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          test -f NOTICE
          test -f TRADEMARK_POLICY
          test -f image/40_release_image.st
          test -f tools/make_release_image.ps1
          test -f tools/make_release_bundle.ps1
